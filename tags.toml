# ============================================================
# tags.toml — Complete IO Tag Registry
# LIM_H / LIM_L tags carry the physical range for each analog
# These are static values — use them in Ignition UDT expressions
# to compute % from engineering units without hardcoding ranges.
#
# Example Ignition expression for HLT1 fill %:
#   ({AI_HLT1_LT} - {AI_HLT1_LT_LIM_L}) /
#   ({AI_HLT1_LT_LIM_H} - {AI_HLT1_LT_LIM_L}) * 100
# ============================================================

