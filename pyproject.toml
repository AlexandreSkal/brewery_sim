[project]
name = "brewery-simulator"
version = "1.0.0"
description = "Industrial Brewery PLC/SCADA Simulator — publishes all IOs via MQTT5"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.3.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
brewery-sim = "brewery_simulator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brewery_simulator"]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
